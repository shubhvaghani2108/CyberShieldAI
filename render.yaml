services:
  - type: web
    name: cybershieldai
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn --bind 0.0.0.0:$PORT --workers 4 dashboard.app:app"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: VIRUSTOTAL_API_KEY
        sync: false
      - key: EMAIL_PROVIDER
        value: "resend"
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "onboarding@resend.dev"
      - key: EMAIL_FROM_NAME
        value: "CyberShieldAI"
      - key: OTP_EXPIRY_MINUTES
        value: "10"
      - key: OTP_MAX_ATTEMPTS
        value: "5"
      - key: OTP_RESEND_COOLDOWN
        value: "60"
