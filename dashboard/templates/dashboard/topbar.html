<header class="topbar">
    <button class="btn btn-ghost sidebar-toggle" type="button" aria-label="Toggle menu">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg>
    </button>

    <div class="page-title">
        <h1>{{ page_title|default('Security Operations Dashboard') }}</h1>
        <span>{{ page_subtitle|default('Live network posture and vulnerability overview') }}</span>
    </div>

    <div class="topbar-actions">
        <button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false" title="Switch dark / light theme">
            <svg class="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <span class="track"><span class="thumb"></span></span>
            <span class="theme-toggle-label">Dark</span>
        </button>
        <span class="topbar-clock">--:--:--</span>
        <button class="btn btn-primary" type="button" data-open-scan-modal>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
            New Scan
        </button>
    </div>
</header>

<div class="modal-overlay" id="newScanModal">
    <div class="modal">
        <h3>Launch a new scan</h3>
        <div class="sub" id="scanModalSub">Runs host discovery, port scan, vulnerability &amp; CVE lookup, and risk scoring.</div>

        <div class="scan-tabs" role="tablist">
            <button type="button" class="scan-tab active" data-scan-tab="ip" role="tab" aria-selected="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></svg>
                IP Scan
            </button>
            <button type="button" class="scan-tab" data-scan-tab="url" role="tab" aria-selected="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>
                URL Scan
            </button>
        </div>

        <!-- IP scan: host discovery + port scan + vuln/CVE lookup + risk scoring -->
        <form id="newScanForm" class="scan-form" data-scan-form="ip" method="POST" action="{{ url_for('scan') }}">
            <div class="field">
                <label for="scan-target">Target IP address</label>
                <input id="scan-target" type="text" name="target" placeholder="e.g. 192.168.1.10" required>
            </div>
            <div class="field">
                <label for="scan-mode">Scan mode</label>
                <select id="scan-mode" name="mode">
                    <option value="quick">Quick scan — top 1000 ports</option>
                    <option value="full">Full scan — all 65535 ports</option>
                </select>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-ghost" data-close-scan-modal>Cancel</button>
                <button type="submit" class="btn btn-primary">Start scan</button>
            </div>
        </form>

        <!-- URL scan: resolves domain, checks protocol/redirects, technology + risk scoring,
             then automatically chains into the same port/vuln/CVE pipeline if an IP resolves -->
        <form id="newUrlScanForm" class="scan-form" data-scan-form="url" method="POST" action="{{ url_for('scan_url_route') }}" style="display:none;">
            <div class="field">
                <label for="scan-url">Target URL</label>
                <input id="scan-url" type="text" name="url" placeholder="e.g. https://example.com" required>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-ghost" data-close-scan-modal>Cancel</button>
                <button type="submit" class="btn btn-primary">Start scan</button>
            </div>
        </form>
    </div>
</div>
