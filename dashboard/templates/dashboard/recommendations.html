<div class="dashboard-card-wrap">
    <div class="panel-heading">
        <h2>💡 Recommended Actions</h2>
        <span class="sub">Generated from the latest scan findings</span>
    </div>

    <div class="glass" style="padding: 14px 18px;">
        {% for rec in recommendations %}
            <div class="rec-item" style="padding: 10px 0; border-bottom: 1px solid var(--border); display: flex; align-items: flex-start; gap: 10px;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 18px; height: 18px; color: var(--accent); flex-shrink: 0; margin-top: 2px;"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2Z"/></svg>
                <span style="font-size: 13px; line-height: 1.5; color: var(--text-0);">{{ rec }}</span>
            </div>
        {% else %}
            <div class="rec-item" style="padding: 10px 0; display: flex; align-items: center; gap: 10px;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 18px; height: 18px; color: var(--ok); flex-shrink: 0;"><path d="M20 6 9 17l-5-5"/></svg>
                <span style="font-size: 13px; color: var(--text-1);">No recommendations yet — run a scan to get prioritized guidance.</span>
            </div>
        {% endfor %}
    </div>
</div>
