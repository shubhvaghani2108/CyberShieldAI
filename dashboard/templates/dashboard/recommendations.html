<div class="overview-card">
    <div class="overview-card-header">
        <div class="overview-card-title">
            <span style="font-size: 15px;">💡</span>
            <span>Recommended Actions</span>
        </div>
    </div>
    <div class="overview-card-body" style="padding: 14px 16px;">
        <div class="rec-actions-list">
            {% if recommendations and recommendations|length > 0 %}
                {% for rec in recommendations[:3] %}
                    <div class="rec-action-item">
                        <span class="rec-bullet-dot {{ 'blue' if loop.index0 % 2 == 0 else 'purple' }}"></span>
                        <span class="rec-action-text">{{ rec }}</span>
                    </div>
                {% endfor %}
            {% else %}
                <div class="rec-action-item">
                    <span class="rec-bullet-dot blue"></span>
                    <span class="rec-action-text">HTTP (Port 80): Redirect all traffic to HTTPS.</span>
                </div>
                <div class="rec-action-item">
                    <span class="rec-bullet-dot purple"></span>
                    <span class="rec-action-text">HTTPS (Port 443): Verify TLS configuration and SSL certificate.</span>
                </div>
            {% endif %}
        </div>
    </div>
</div>
