<!DOCTYPE html>
<html lang="en" {% if request.cookies.get('csa_theme') == 'light' %}data-theme="light"{% elif request.cookies.get('csa_theme') == 'dark' %}data-theme="dark"{% endif %}>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CyberShieldAI{% endblock %} — Security Operations Center</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">

    <!-- Applies the saved or system theme before first paint, preventing theme flash & navigation flips -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("csa-theme");
          if (!t) {
            var match = document.cookie.match(new RegExp('(^| )csa_theme=([^;]+)'));
            if (match) t = match[2];
          }
          if (!t) {
            if (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) {
              t = "light";
            } else {
              t = "dark";
            }
          }
          if (t === "light") {
            document.documentElement.setAttribute("data-theme", "light");
          } else {
            document.documentElement.setAttribute("data-theme", "dark");
          }
        } catch (e) {}
      })();
    </script>

    <meta name="csrf-token" content="{{ csrf_token() if csrf_token is defined else '' }}">
    {% block extra_head %}{% endblock %}
</head>
<body>

<div class="particles"></div>

<div class="app-shell">

    {% include 'dashboard/sidebar.html' %}
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <div class="main">
        {% include 'dashboard/topbar.html' %}

        <div class="container">
            {% block content %}{% endblock %}
        </div>

        {% include 'dashboard/footer.html' %}
    </div>
</div>

<div class="toast-stack"></div>

{% block extra_scripts_before %}{% endblock %}
<script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script defer src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
